[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "biped-walker"
version = "0.2.0"
description = "MuJoCo simulation, Gymnasium env and RL agents for a 4-DoF biped walker with tactile feet"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.1",
    "gymnasium>=0.29",
    "numpy>=1.23",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
ppo = ["stable-baselines3>=2.2", "torch>=2.0", "tensorboard"]
examples = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["biped_walker*"]

[tool.setuptools.package-data]
biped_walker = ["assets/meshes/*.STL"]
