[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "biped-walker"
version = "0.3.0"
description = "MuJoCo simulation, Gymnasium envs and RL agents for tactile-footed bipeds (4-DoF walker and 8-DoF servo-bracket biped)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.1",
    "gymnasium>=0.29",
    "numpy>=1.23",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
ppo = ["stable-baselines3>=2.2", "torch>=2.0", "tensorboard"]
examples = ["matplotlib"]   # also used by biped_walker.cad.render
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["biped_walker*"]

[tool.setuptools.package-data]
biped_walker = ["assets/walker4/meshes/*.STL", "assets/biped8/*.json", "assets/biped8/meshes/*.stl"]
